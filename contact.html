<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我 | XXX 個人介紹</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #0d0f14;
            --bg-secondary: #151820;
            --bg-card: #1a1f2e;
            --bg-card-hover: #212838;
            --text-primary: #e8eaf0;
            --text-secondary: #9aa3b5;
            --text-muted: #6b7280;
            --accent-cyan: #4dd8e6;
            --accent-blue: #5b8cff;
            --accent-purple: #8b5cf6;
            --danger: #ff6b81;
            --border-subtle: #2a3040;
            --glow-cyan: rgba(77, 216, 230, 0.15);
            --font-sans: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed; top: -20%; left: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle at center, rgba(91, 140, 255, 0.06), transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 0;
            animation: floatGlow 18s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed; bottom: -25%; right: -15%;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.05), transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 0;
            animation: floatGlow 22s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatGlow {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(30px, -40px) scale(1.05); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
        .visually-hidden {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }

        /* ===== 頁首與導覽 ===== */
        .site-header { border-bottom: 1px solid var(--border-subtle); margin-bottom: 50px; }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; flex-wrap: wrap; gap: 12px;
        }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-logo {
            width: 36px; height: 36px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: #0d0f14; letter-spacing: -0.5px;
        }
        .nav-name { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); letter-spacing: 1px; }
        .nav-links { display: flex; gap: 24px; list-style: none; align-items: center; }
        .nav-links a {
            color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;
            font-weight: 500; transition: color 0.3s ease; position: relative; letter-spacing: 0.5px;
        }
        .nav-links a::after {
            content: ''; position: absolute; bottom: -4px; left: 0;
            width: 0; height: 2px; background: var(--accent-cyan);
            transition: width 0.3s ease; border-radius: 2px;
        }
        .nav-links a:hover, .nav-links a:focus-visible { color: var(--text-primary); }
        .nav-links a:hover::after, .nav-links a:focus-visible::after { width: 100%; }
        .nav-links a.active { color: var(--text-primary); }
        .nav-links a.active::after { width: 100%; }

        /* ===== 頁面標題 ===== */
        .page-header { margin-bottom: 36px; }
        .page-title {
            font-size: 2.2rem; font-weight: 700; letter-spacing: 1px; line-height: 1.3;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .page-subtitle { margin-top: 8px; font-size: 0.95rem; color: var(--text-secondary); letter-spacing: 0.3px; }

        /* ===== 聯絡資訊卡片 ===== */
        .contact-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px; margin-bottom: 50px;
        }
        .contact-card {
            display: flex; align-items: center; gap: 16px;
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 20px 22px; text-decoration: none; color: inherit;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); transition: all 0.35s ease;
        }
        .contact-card:hover, .contact-card:focus-visible {
            outline: none; border-color: rgba(77, 216, 230, 0.35);
            background: var(--bg-card-hover); transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.35), 0 0 50px var(--glow-cyan);
        }
        .contact-icon {
            width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            background: linear-gradient(135deg, rgba(77, 216, 230, 0.16), rgba(91, 140, 255, 0.16));
            border: 1px solid var(--border-subtle);
        }
        .contact-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .contact-label {
            font-size: 0.72rem; font-weight: 500; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--text-muted);
        }
        .contact-value {
            font-size: 0.92rem; font-weight: 500; color: var(--text-primary); word-break: break-all;
        }

        /* ===== 留言表單 ===== */
        .form-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 28px 30px;
            transition: all 0.4s ease; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .form-card:hover {
            border-color: rgba(77, 216, 230, 0.3);
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.35), 0 0 50px var(--glow-cyan);
            transform: translateY(-3px);
        }
        .bio-card-title {
            font-size: 1.2rem; font-weight: 600; margin-bottom: 16px;
            display: flex; align-items: center; gap: 10px;
            color: var(--text-primary); letter-spacing: 0.5px;
        }
        .bio-card-title::before {
            content: ''; display: inline-block; width: 4px; height: 20px; border-radius: 4px;
            background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-blue));
        }
        .form-hint { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 26px; letter-spacing: 0.3px; }
        .required { color: var(--accent-cyan); font-weight: 700; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .form-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-grid .form-field { margin-bottom: 0; }
        .form-field label {
            font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.5px;
        }
        .signup-form input:not([type="checkbox"]), .signup-form textarea {
            width: 100%; font-family: inherit; font-size: 0.9rem; color: var(--text-primary);
            background: var(--bg-secondary); border: 1px solid var(--border-subtle);
            border-radius: 10px; padding: 12px 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }
        .signup-form textarea { resize: vertical; min-height: 130px; line-height: 1.7; }
        .signup-form ::placeholder { color: var(--text-muted); opacity: 0.85; }
        .signup-form input:focus, .signup-form textarea:focus {
            outline: none; border-color: var(--accent-cyan);
            background: var(--bg-card-hover); box-shadow: 0 0 0 3px rgba(77, 216, 230, 0.12);
        }
        .signup-form :is(input, textarea):user-invalid {
            border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255, 107, 129, 0.12);
        }
        .checkbox-line {
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
            color: var(--text-secondary); cursor: pointer; transition: color 0.3s ease;
        }
        .checkbox-line:hover { color: var(--text-primary); }
        .signup-form input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: var(--accent-cyan); cursor: pointer; flex-shrink: 0;
        }
        .form-actions {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--border-subtle);
        }
        .btn-submit, .btn-reset {
            font-family: inherit; font-size: 0.9rem; font-weight: 600; letter-spacing: 1px;
            border-radius: 25px; padding: 12px 32px; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-submit {
            border: none;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #0d0f14;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--glow-cyan), 0 0 40px rgba(91, 140, 255, 0.2);
        }
        .btn-reset { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); }
        .btn-reset:hover { border-color: var(--accent-purple); color: var(--text-primary); transform: translateY(-2px); }
        .btn-submit:focus-visible, .btn-reset:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 3px; }

        .form-section { margin-bottom: 80px; }

        /* ===== 頁腳 ===== */
        .site-footer {
            border-top: 1px solid var(--border-subtle); padding: 24px 0;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-top: 20px;
        }
        .footer-text { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.5px; }
        .footer-socials { display: flex; gap: 16px; list-style: none; }
        .footer-socials a {
            color: var(--text-muted); text-decoration: none; font-size: 0.8rem;
            transition: color 0.3s ease; letter-spacing: 0.5px;
        }
        .footer-socials a:hover, .footer-socials a:focus-visible { color: var(--accent-cyan); }

        /* ===== RWD ===== */
        @media (max-width: 768px) {
            .page-title { font-size: 1.7rem; }
            .navbar { flex-direction: column; align-items: center; gap: 16px; }
            .nav-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
            .form-card { padding: 20px; }
            .form-actions { flex-direction: column-reverse; align-items: stretch; }
            .btn-submit, .btn-reset { width: 100%; text-align: center; }
            .site-footer { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container">
            <nav class="navbar" aria-label="主選單">
                <a class="nav-brand" href="index.html">
                    <div class="nav-logo" aria-hidden="true">X</div>
                    <span class="nav-name">XXX</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">首頁</a></li>
                    <li><a href="aboutme.html">關於我</a></li>
                    <li><a href="contact.html" class="active" aria-current="page">聯絡我</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="top">
        <div class="container">

            <div class="page-header">
                <h1 class="page-title">聯絡我</h1>
                <p class="page-subtitle">有任何問題、合作邀約或想聊聊天，都歡迎與我聯繫</p>
            </div>

            <!-- 聯絡資訊卡片 -->
            <section class="contact-grid" aria-label="聯絡資訊">
                <a class="contact-card" href="mailto:example@mail.com">
                    <div class="contact-icon" aria-hidden="true">✉️</div>
                    <div class="contact-body">
                        <span class="contact-label">Email</span>
                        <span class="contact-value">example@mail.com</span>
                    </div>
                </a>
                <a class="contact-card" href="#" target="_blank" rel="noopener">
                    <div class="contact-icon" aria-hidden="true">🐙</div>
                    <div class="contact-body">
                        <span class="contact-label">GitHub</span>
                        <span class="contact-value">github.com/xxx</span>
                    </div>
                </a>
                <a class="contact-card" href="#" target="_blank" rel="noopener">
                    <div class="contact-icon" aria-hidden="true">📷</div>
                    <div class="contact-body">
                        <span class="contact-label">Instagram</span>
                        <span class="contact-value">@xxx</span>
                    </div>
                </a>
            </section>

            <!-- 留言表單 -->
            <section class="form-section" aria-labelledby="contact-title">
                <div class="form-card">
                    <h2 class="bio-card-title" id="contact-title">傳送訊息</h2>
                    <p class="form-hint">
                        填寫以下欄位送出訊息，標示
                        <span class="required" aria-hidden="true">*</span>
                        <span class="visually-hidden">（必填）</span>
                        的欄位為必填。
                    </p>

                    <form class="signup-form" action="#" method="post">
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="name">姓名 <span class="required" aria-hidden="true">*</span></label>
                                <input type="text" id="name" name="name" placeholder="請輸入你的姓名" autocomplete="name" required>
                            </div>
                            <div class="form-field">
                                <label for="email">電子郵件 <span class="required" aria-hidden="true">*</span></label>
                                <input type="email" id="email" name="email" placeholder="example@mail.com" autocomplete="email" required>
                            </div>
                            <div class="form-field">
                                <label for="subject">主旨</label>
                                <input type="text" id="subject" name="subject" placeholder="想聊什麼呢？">
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="message">訊息內容 <span class="required" aria-hidden="true">*</span></label>
                            <textarea id="message" name="message" rows="6" placeholder="請輸入你想對我說的話…" required></textarea>
                        </div>

                        <div class="form-field">
                            <label class="checkbox-line" for="agree">
                                <input type="checkbox" id="agree" name="agree" required>
                                我已閱讀並同意個資使用聲明
                                <span class="required" aria-hidden="true">*</span>
                            </label>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit">送出訊息</button>
                            <button type="reset" class="btn-reset">清除重填</button>
                        </div>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <footer class="site-footer">
        <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <p class="footer-text">© 2025 XXX | 國立勤益科技大學</p>
            <ul class="footer-socials">
                <li><a href="#">GitHub</a></li>
                <li><a href="mailto:example@mail.com">Email</a></li>
                <li><a href="#">Instagram</a></li>
            </ul>
        </div>
    </footer>
    <script>
(function () {
    'use strict';

    // 取得當前頁面檔名（若為目錄則視為 index.html）
    function getCurrentPage() {
        var path = window.location.pathname.split('/').pop();
        if (!path) path = 'index.html';
        return path;
    }

    var currentPage = getCurrentPage();

    document.querySelectorAll('a[href]').forEach(function (link) {
        var rawHref = link.getAttribute('href');

        // 忽略：外部連結、錨點、mailto、tel、javascript 等
        if (!rawHref ||
            rawHref.charAt(0) === '#' ||
            rawHref.indexOf('http://') === 0 ||
            rawHref.indexOf('https://') === 0 ||
            rawHref.indexOf('//') === 0 ||
            rawHref.indexOf('mailto:') === 0 ||
            rawHref.indexOf('tel:') === 0 ||
            rawHref.indexOf('javascript:') === 0) {
            return;
        }

        // 取得連結目標檔名（去掉 query 與 hash）
        var targetPage = rawHref.split('#')[0].split('?')[0].split('/').pop();
        if (!targetPage) targetPage = 'index.html';

        // 目標與當前頁面相同時
        if (targetPage === currentPage) {
            // 標記為當前頁（若 HTML 已有 active 也無妨，重複加入不影響）
            link.setAttribute('aria-current', 'page');
            link.classList.add('active');

            // 阻止重新載入，改為平滑捲動到頁面頂端
            link.addEventListener('click', function (e) {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    });
})();
</script>
</body>
</html>
